<!DOCTYPE html>
<html lang="en-us">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <meta charset="utf-8">
    <title>EOS-503</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="custom-bg" hidden></div>
    <div id="custom-logo" hidden></div>

    <div id="custom-loader" hidden>
      <div class="fill"></div>
      <div class="label"></div>
    </div>

    <div class="webgl-content">
      <div id="unityContainer" style="width: 1280px; height: 720px; background: rgba(0, 0, 0, 0) !important;"></div>
      <div class="footer">
        <div class="webgl-logo"></div>
        <div class="fullscreen" onclick="unityInstance.SetFullscreen(1)"></div>
        <div class="title">EOS-503</div>
      </div>
    </div>
	<script>
(function () {
  var buildUrl = "Build";
  var loaderUrl = buildUrl + "/WebGL Testing Build.loader.js";
  var config = {
    dataUrl: buildUrl + "/WebGL Testing Build.data",
    frameworkUrl: buildUrl + "/WebGL Testing Build.framework.js",
    codeUrl: buildUrl + "/WebGL Testing Build.wasm",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "Pyrebug",
    productName: "EOS-503",
    productVersion: "1.0",
  };

  function bootUnity() {
    var container = document.getElementById("unityContainer");
    if (!container) {
      console.error("Missing #unityContainer");
      return;
    }

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(container, config).then(function (instance) {
        window.unityInstance = instance;
      }).catch(function (e) {
        console.error(e);
      });
    };
    script.onerror = function () {
      console.error("Failed to load:", loaderUrl);
    };

    (document.head || document.documentElement).appendChild(script);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bootUnity);
  } else {
    bootUnity();
  }
})();
</script>
  </body>
</html>
